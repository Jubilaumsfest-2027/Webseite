<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden – Jubiläumsfest Bietzen 2027</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <!-- Absolute Pfade: Netlify zeigt diese Seite unter jeder beliebigen Adresse an. -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .notfound { min-height: 100vh; min-height: 100svh; padding: 48px 0; }
    .notfound .hero__logo { width: min(520px, 100%); margin-bottom: 2rem; }
    .notfound__code { font: 400 clamp(6rem, 26vw, 11rem)/.9 var(--font-head); color: var(--rot); margin: 0; }
    .notfound__title { font: 400 clamp(2rem, 6vw, 3.2rem)/1.1 var(--font-head); letter-spacing: .06em; margin: .4rem 0 .6rem; }
    .notfound__text { max-width: 480px; margin: 0 auto; color: var(--muted); }
  </style>
</head>
<body>
  <main class="hero notfound">
    <div class="container hero__content">
      <a href="/"><img class="hero__logo" src="/bilder/logo-hell.webp" width="1600" height="607" alt="Jubiläumsfest Bietzen 2027 – zur Startseite"></a>
      <p class="notfound__code">404</p>
      <h1 class="notfound__title">Abseits!</h1>
      <p class="hero__tagline">Hier spielt leider keine Musik.</p>
      <p class="notfound__text">Die Seite, die du suchst, gibt es nicht – vielleicht hat sich ein Tippfehler in die Adresse geschlichen.</p>
      <div class="hero__actions">
        <a href="/" class="btn">Zur Startseite</a>
        <a href="/#programm" class="btn btn--ghost">Zum Programm</a>
      </div>
    </div>
  </main>
</body>
</html>
